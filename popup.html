<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 260px;
    padding: 16px;
    font-family: Tahoma, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e8eaed;
  }
  h2 { font-size: 15px; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0 0 14px; font-size: 13px; }
  li { padding: 6px 0; border-bottom: 1px solid #2a2e3a; color: #cfd2d8; }
  li:last-child { border-bottom: none; }
  .empty { color: #9aa0ac; font-size: 13px; }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #6fa2ff; }
</style>
</head>
<body>
  <h2>ورود خودکار به گوگل میت</h2>
  <div id="list"></div>
  <button id="openOptions">تنظیمات</button>
  <script src="popup.js"></script>
</body>
</html>
