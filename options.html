<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<title data-i18n="optionsTitle">تنظیمات</title>
<script src="theme.js"></script>
<style>
  @font-face {
    font-family: "Vazir";
    src: url("font/Vazir-Medium.woff") format("woff");
    font-weight: normal;
    font-style: normal;
  }

  /* ── Dark theme (default) ───────────────────────────── */
  :root {
    --bg:                 #0f1115;
    --panel:              #171a21;
    --border:             #2a2e3a;
    --text:               #e8eaed;
    --muted:              #9aa0ac;
    --accent:             #4f8cff;
    --accent-hover:       #6fa2ff;
    --danger:             #e05a5a;
    --input-bg:           #10131a;
    --btn-secondary-bg:   #262a35;
    --btn-secondary-hover:#303543;
    --status-color:       #6fd67e;
    --toggle-on-bg:       #1a3a1a;
    --toggle-on-text:     #6fd67e;
    --toggle-off-bg:      #3a1a1a;
    --toggle-off-text:    #e08080;
  }

  /* ── Light theme ────────────────────────────────────── */
  html[data-theme="light"] {
    --bg:                 #f0f2f8;
    --panel:              #ffffff;
    --border:             #d1d5e0;
    --text:               #1e2128;
    --muted:              #6b7280;
    --accent:             #2563eb;
    --accent-hover:       #1d4ed8;
    --danger:             #dc2626;
    --input-bg:           #f8f9fc;
    --btn-secondary-bg:   #e8ebf4;
    --btn-secondary-hover:#dde1ef;
    --status-color:       #15803d;
    --toggle-on-bg:       #dcfce7;
    --toggle-on-text:     #15803d;
    --toggle-off-bg:      #fee2e2;
    --toggle-off-text:    #dc2626;
  }

  @media (prefers-color-scheme: light) {
    html:not([data-theme="dark"]) {
      --bg:                 #f0f2f8;
      --panel:              #ffffff;
      --border:             #d1d5e0;
      --text:               #1e2128;
      --muted:              #6b7280;
      --accent:             #2563eb;
      --accent-hover:       #1d4ed8;
      --danger:             #dc2626;
      --input-bg:           #f8f9fc;
      --btn-secondary-bg:   #e8ebf4;
      --btn-secondary-hover:#dde1ef;
      --status-color:       #15803d;
      --toggle-on-bg:       #dcfce7;
      --toggle-on-text:     #15803d;
      --toggle-off-bg:      #fee2e2;
      --toggle-off-text:    #dc2626;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: "Vazir", Tahoma, "Segoe UI", sans-serif;
    max-width: 720px;
    margin-inline: auto;
    transition: background 0.2s, color 0.2s;
  }

  .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .page-header h1 { margin: 0; font-size: 20px; }
  .theme-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 18px;
    padding: 4px 9px;
    line-height: 1;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .theme-btn:hover { background: var(--btn-secondary-bg); }

  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 13px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    transition: background 0.2s, border-color 0.2s;
  }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  input[type="text"], input[type="url"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
    font-family: inherit;
    transition: background 0.2s, border-color 0.2s;
  }
  input[type="time"] {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input[type="number"] {
    width: 80px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    margin: 0;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-btn {
    padding: 6px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    user-select: none;
    font-family: inherit;
  }
  .day-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  button {
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: var(--btn-secondary-bg); color: var(--text); }
  button.secondary:hover { background: var(--btn-secondary-hover); }
  button.danger { background: transparent; color: var(--danger); padding: 6px 10px; }
  button.danger:hover { background: transparent; }
  button.toggle-on  { background: var(--toggle-on-bg);  color: var(--toggle-on-text);  padding: 4px 10px; font-size: 12px; }
  button.toggle-on:hover  { opacity: 0.85; }
  button.toggle-off { background: var(--toggle-off-bg); color: var(--toggle-off-text); padding: 4px 10px; font-size: 12px; }
  button.toggle-off:hover { opacity: 0.85; }
  tr.disabled-entry td { opacity: 0.4; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: normal; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .checkbox-row input { width: auto; margin: 0; }
  .status { font-size: 13px; color: var(--status-color); height: 18px; margin-top: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: -8px; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="page-header">
    <h1 data-i18n="pageHeading">ورود خودکار به گوگل میت</h1>
    <div style="display:flex;gap:6px;">
      <button class="theme-btn" id="langToggle" title="toggle language">FA</button>
      <button class="theme-btn" id="themeToggle" title="toggle theme">🌙</button>
    </div>
  </div>
  <p class="sub" data-i18n="pageSubtitle">لینک جلسه، نام نمایشی و برنامه زمانی را تنظیم کنید.</p>

  <div class="card">
    <label for="meetLink" data-i18n="labelMeetLink">لینک جلسه گوگل میت (ثابت)</label>
    <input type="url" id="meetLink" data-i18n-placeholder="placeholderMeetLink" placeholder="https://meet.google.com/xxx-xxxx-xxx" />

    <label for="displayName" data-i18n="labelDisplayName">نامی که در صورت نمایش فیلد «نام» وارد شود</label>
    <input type="text" id="displayName" data-i18n-placeholder="placeholderDisplayName" placeholder="مثلاً: نیما محمدخانی" />

    <div class="checkbox-row">
      <input type="checkbox" id="muteBeforeJoin" />
      <label for="muteBeforeJoin" data-i18n="labelMuteBeforeJoin" style="margin:0;">قبل از ورود، میکروفون و دوربین را خاموش کن</label>
    </div>
  </div>

  <div class="card">
    <label data-i18n="sectionSchedule">افزودن زمان جدید</label>
    <div class="row" style="margin-bottom: 10px;">
      <div class="days" id="dayPicker">
        <div class="day-btn" data-day="6" data-i18n="day6">شنبه</div>
        <div class="day-btn" data-day="0" data-i18n="day0">یکشنبه</div>
        <div class="day-btn" data-day="1" data-i18n="day1">دوشنبه</div>
        <div class="day-btn" data-day="2" data-i18n="day2">سه‌شنبه</div>
        <div class="day-btn" data-day="3" data-i18n="day3">چهارشنبه</div>
        <div class="day-btn" data-day="4" data-i18n="day4">پنجشنبه</div>
        <div class="day-btn" data-day="5" data-i18n="day5">جمعه</div>
      </div>
      <input type="time" id="timeInput" value="09:00" />
      <button id="addScheduleBtn" data-i18n="btnAdd">افزودن</button>
    </div>
    <input type="text" id="entryLabel" data-i18n-placeholder="placeholderEntryLabel" placeholder="عنوان جلسه..." style="margin-bottom: 8px;" />
    <input type="url" id="entryLink" data-i18n-placeholder="placeholderEntryLink" placeholder="لینک جلسه این ردیف..." style="margin-bottom: 8px;" />
    <div class="hint" data-i18n="hintSchedule">می‌توانید چند روز را هم‌زمان انتخاب کنید.</div>

    <table id="scheduleTable">
      <thead>
        <tr>
          <th data-i18n="tableColTitle">عنوان</th>
          <th data-i18n="tableColDay">روز</th>
          <th data-i18n="tableColTime">ساعت</th>
          <th data-i18n="tableColLink">لینک</th>
          <th data-i18n="tableColStatus">وضعیت</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>

  <div class="card">
    <label data-i18n="sectionNotifyBefore" style="margin-bottom: 12px; color: var(--text); font-size: 14px;">اعلان مرورگر قبل از جلسه</label>
    <div class="checkbox-row">
      <input type="checkbox" id="notifyBefore" />
      <label for="notifyBefore" data-i18n="labelNotifyBefore" style="margin:0;">قبل از شروع جلسه، اعلان مرورگر نشان بده</label>
    </div>
    <div class="row" style="margin-top: 12px; align-items: center; gap: 12px;">
      <label data-i18n="labelNotifyBeforeMinutes" style="margin: 0; white-space: nowrap;">چند دقیقه قبل:</label>
      <input type="number" id="notifyBeforeMinutes" min="1" max="60" value="5" />
    </div>
  </div>

  <div class="card">
    <label data-i18n="sectionTelegram" style="margin-bottom: 12px; color: var(--text); font-size: 14px;">اطلاع‌رسانی در تلگرام</label>
    <p class="hint" data-i18n="telegramDesc" style="margin-top: -4px;"></p>

    <label for="telegramBotToken" data-i18n="labelBotToken">توکن ربات تلگرام (Bot Token)</label>
    <input type="text" id="telegramBotToken" data-i18n-placeholder="placeholderBotToken" placeholder="123456789:AAE..." />

    <label for="telegramChatId" data-i18n="labelChatId">Chat ID</label>
    <input type="text" id="telegramChatId" data-i18n-placeholder="placeholderChatId" placeholder="مثلاً: 123456789" />

    <label for="telegramMessage" data-i18n="labelTelegramMessage">متن پیام</label>
    <input type="text" id="telegramMessage" data-i18n-placeholder="placeholderTelegramMessage" placeholder="⚠️ ..." />

    <label for="lateThreshold" data-i18n="labelLateThreshold">اگر کروم بسته بوده و بیشتر از این‌قدر دقیقه گذشته، پیام بده</label>
    <input type="text" id="lateThreshold" style="width: 90px; margin-bottom: 16px;" value="5" />

    <div class="checkbox-row">
      <input type="checkbox" id="notifyOnLate" />
      <label for="notifyOnLate" data-i18n="labelNotifyOnLate" style="margin:0;">وقتی کروم سر ساعت باز نبوده، پیام بده</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="notifyOnFail" />
      <label for="notifyOnFail" data-i18n="labelNotifyOnFail" style="margin:0;">وقتی ورود خودکار با شکست مواجه شد، پیام بده</label>
    </div>

    <button class="secondary" id="testTelegramBtn" data-i18n="btnTestTelegram">ارسال پیام تست به تلگرام</button>
  </div>

  <div class="row">
    <button id="saveBtn" data-i18n="btnSave">ذخیره تنظیمات</button>
    <button class="secondary" id="testBtn" data-i18n="btnTestJoin">تست همین الان</button>
  </div>
  <div class="status" id="status"></div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
